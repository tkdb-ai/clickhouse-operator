# Default values for clickhouse-installation.

global:
  security:
    allowInsecureImages: true

nameOverride: ''
fullnameOverride: ''

# Cluster Layout
layout:
  shardsCount: 1
  replicasCount: 2

# ClickHouse Image
image:
  repository: clickhouse/clickhouse-server
  tag: '24.8'
  pullPolicy: IfNotPresent

# Storage Configuration
storage:
  data:
    size: 10Gi
    storageClassName: hostpath # Change to your storage class
    accessModes:
      - ReadWriteOnce
  log:
    enabled: false
    size: 2Gi
    storageClassName: hostpath
    accessModes:
      - ReadWriteOnce

# Coordination — required for replication and distributed DDL
# mode: keeper     → deploy a ClickHouseKeeperInstallation (recommended, no external deps)
# mode: zookeeper  → point at an existing external ZooKeeper ensemble
# mode: none       → disable coordination (single-node, no replication)
coordination:
  mode: keeper

  keeper:
    replicasCount: 1  # Use 3 for production HA (must be odd for quorum)
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.1"
      pullPolicy: IfNotPresent
    storage:
      size: 10Gi
      storageClassName: hostpath
      accessModes:
        - ReadWriteOnce
    resources: {}
      # limits:
      #   cpu: 500m
      #   memory: 512Mi

  zookeeper:
    nodes:
      - host: zookeeper.default.svc.cluster.local
        port: 2181

# ClickHouse Settings (config.xml)
settings:
  compression/case/method: zstd

# ClickHouse Users (users.xml)
adminPassword: '' # Leave empty to generate a random one
users:
  default:
    password: "password"
    networks/ip: "0.0.0.0/0"
  admin:
    profile: default
    networks/ip: 0.0.0.0/0
    access_management: '1'
  dev-user:
    password: adminpassword

# Profiles and Quotas
profiles: {} # default/max_memory_usage: 1000000000

quotas: {}

# Resource Limits/Requests
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Probe Configuration
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 10

# Monitoring
# Enables prometheus monitoring endpoint in ClickHouse
monitoring:
  enabled: true
  # Whether to create a ServiceMonitor for the Prometheus Operator
  serviceMonitor: false
  # Prometheus endpoint configuration
  prometheus:
    enabled: true
    port: 9363

# Custom Configuration Files
files: {}
  # dict1.xml: |
  #   <yandex>
  #       <!-- dictionary config -->
  #   </yandex>

# Tabix UI
# A standalone UI to manage ClickHouse
tabix-ui:
  enabled: true

# Backup — clickhouse-backup sidecar (https://github.com/Altinity/clickhouse-backup)
# Runs as a sidecar alongside ClickHouse, exposes a REST API on port 7171.
# When garage.enabled=true, credentials are read automatically from the garage-backup secret.
# Trigger manually: kubectl exec <pod> -c clickhouse-backup -- clickhouse-backup create-and-upload
backup:
  enabled: true
  image:
    repository: altinity/clickhouse-backup
    tag: "2.7.2"
    pullPolicy: IfNotPresent
  s3:
    bucket: "clickhouse"
    path: "clickhouse-backup/"
    endpoint: ""          # Leave empty to auto-use Garage when garage.enabled=true
    region: "garage"
    accessKey: ""         # Ignored when garage.enabled=true (credentials come from garage-backup secret)
    secretKey: ""
    forcePathStyle: true  # Required for non-AWS S3 (Garage, MinIO, etc.)
  keepRemote: 7           # Number of remote backups to retain
  schedule: "0 2 * * *"  # Daily at 2am UTC
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Garage — bundled S3-compatible object store
# When enabled, deploys Garage (lightweight single-binary S3 server, ~35MB RSS)
# and configures ClickHouse to use it as an S3 disk for tiered storage.
# A post-install hook configures the cluster layout, creates the bucket,
# generates a key, and writes credentials to the `garage-backup` secret.
#
# Garage requires its own GK<24-hex> key format, so the key is auto-generated
# by the setup hook. ClickHouse reads it via env vars injected from the secret
# (see podTemplate.extraEnv below). The storage_config.xml uses from_env to
# pick up the credentials at startup.
garage:
  enabled: true
  bucket: clickhouse        # Bucket ClickHouse will read/write from
  storagePolicy: s3_main    # ClickHouse storage policy name to create

  # -- Replication factor (1 = single-node, no redundancy)
  replicationFactor: 1

  # -- RPC secret for inter-node communication (32-byte hex string)
  rpcSecret: "1799bccfd7411eddcf9ebd1e76e6cb37cb572f4ce8c8e7b6ec0ecc4ae9b4a8d1"

  # -- Admin API token (required to enable admin endpoints)
  adminToken: "garage-admin-token-change-me"

  # -- Metrics API token (for /metrics endpoint)
  metricsToken: "garage-metrics-token-change-me"

  # -- Persistent storage
  persistence:
    meta:
      size: 256Mi
    data:
      size: 20Gi

# Advanced: Pod Template Extra Configuration
podTemplate:
  # S3 disk credentials are injected from the Garage backup secret so the
  # storage_config.xml's from_env references resolve at clickhouse-server
  # startup. The secret name is fixed (`garage-backup`) so this block works
  # for any release name. If you set garage.enabled=false, remove this
  # extraEnv block (the referenced secret will not exist).
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: garage-backup
          key: access-key-id
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: garage-backup
          key: secret-access-key
  extraVolumeMounts:
    - name: data-volumeclaim-template
      mountPath: /var/lib/clickhouse
  # extraVolumes: []
  sidecars:
    - name: clickhouse-data-checker
      image: busybox:1.35
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - '-c'
        - |
          while true; do
            du -sh /var/lib/clickhouse || true
            sleep 60
          done
      volumeMounts:
        - name: data-volumeclaim-template
          mountPath: /var/lib/clickhouse
          readOnly: true
  # sidecars: []

  # Advanced: Service Template
serviceTemplate:
  type: ClusterIP
  # annotations: {}