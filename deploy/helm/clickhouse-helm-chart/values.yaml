# Default values for clickhouse-installation.

global:
  security:
    allowInsecureImages: true

nameOverride: ''
fullnameOverride: ''

# Cluster Layout
layout:
  shardsCount: 1
  replicasCount: 1

# ClickHouse Image
image:
  repository: clickhouse/clickhouse-server
  tag: '25.8'
  pullPolicy: IfNotPresent

# Storage Configuration
storage:
  data:
    size: 10Gi
    storageClassName: '' # Leave blank to use the cluster default StorageClass; set to your class name (e.g. hostpath, gp3) as needed
    accessModes:
      - ReadWriteOnce
  log:
    enabled: false
    size: 2Gi
    storageClassName: '' # Leave blank to use the cluster default StorageClass
    accessModes:
      - ReadWriteOnce

# Coordination — required for replication and distributed DDL
# mode: keeper     → deploy a ClickHouseKeeperInstallation (recommended, no external deps)
# mode: zookeeper  → point at an existing external ZooKeeper ensemble
# mode: none       → disable coordination (single-node, no replication)
coordination:
  mode: keeper

  keeper:
    replicasCount: 1  # Use 3 for production HA (must be odd for quorum)
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.8"
      pullPolicy: IfNotPresent
    storage:
      size: 10Gi
      storageClassName: '' # Leave blank to use the cluster default StorageClass
      accessModes:
        - ReadWriteOnce
    resources: {}
      # limits:
      #   cpu: 500m
      #   memory: 512Mi

  zookeeper:
    nodes:
      - host: zookeeper.default.svc.cluster.local
        port: 2181

# ClickHouse Settings (config.xml)
settings:
  compression/case/method: zstd

# ClickHouse Users (users.xml)
adminPassword: '' # Leave empty to generate a random one
users:
  default:
    password: "password"
    networks/ip: "0.0.0.0/0"
  admin:
    profile: default
    networks/ip: 0.0.0.0/0
    access_management: '1'
  dev-user:
    password: adminpassword

# Profiles and Quotas
profiles: {} # default/max_memory_usage: 1000000000

quotas: {}

# Resource Limits/Requests
resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Probe Configuration
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 10

# Monitoring
# Enables prometheus monitoring endpoint in ClickHouse
monitoring:
  enabled: true
  # Whether to create a ServiceMonitor for the Prometheus Operator
  serviceMonitor: false
  # Prometheus endpoint configuration
  prometheus:
    enabled: true
    port: 9363

# Custom Configuration Files
files: {}
  # dict1.xml: |
  #   <yandex>
  #       <!-- dictionary config -->
  #   </yandex>

# Named Collections
# Reusable connection definitions for dictionary/table sources, referenced as
# SOURCE(CLICKHOUSE(NAME '<key>')) instead of hardcoding HOST/USER/PASSWORD in
# every CREATE DICTIONARY. Rendered into named_collections.xml; password is
# always the admin user's, read from the CLICKHOUSE_ADMIN_PASSWORD env var
# (injected from the {{ fullname }}-admin secret, see templates/chi.yaml) --
# never written into this file or any SQL. Set to {} to disable entirely.
namedCollections:
  user_labels_source:
    host: localhost
    port: 9000
    user: admin
    db: db
    table: user_labels

# CH-UI — modern web client to manage ClickHouse (https://github.com/caioricciuti/ch-ui)
ch-ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/caioricciuti/ch-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5521
  # ClickHouse connection for the UI's default session.
  clickhouse:
    # HTTP endpoint. Blank auto-targets this release's in-cluster ClickHouse
    # service (http://clickhouse-<release>-clickhouse-installation:8123).
    url: ""
    user: admin
    # Password is read from a Secret. Blank existingSecret uses this release's
    # admin secret (<release>-clickhouse-installation-admin, key "admin").
    existingSecret: ""
    secretKey: admin
    # Enable advanced/admin features in the UI (requires an admin-capable user).
    useAdvanced: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Backup — clickhouse-backup sidecar (https://github.com/Altinity/clickhouse-backup)
# Runs as a sidecar alongside ClickHouse, exposes a REST API on port 7171.
# When garage.enabled=true, credentials are read automatically from the garage-backup secret.
# Trigger manually: kubectl exec <pod> -c clickhouse-backup -- clickhouse-backup create-and-upload
backup:
  enabled: true
  image:
    repository: altinity/clickhouse-backup
    tag: "2.7.2"
    pullPolicy: IfNotPresent
  s3:
    bucket: "clickhouse"
    path: "clickhouse-backup/"
    endpoint: ""          # Leave empty to auto-use Garage when garage.enabled=true
    region: "garage"
    accessKey: ""         # Ignored when garage.enabled=true (credentials come from garage-backup secret)
    secretKey: ""
    forcePathStyle: true  # Required for non-AWS S3 (Garage, MinIO, etc.)
  keepRemote: 7           # Number of remote backups to retain
  schedule: "0 2 * * *"  # Daily at 2am UTC
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Garage — bundled S3-compatible object store
# When enabled, deploys Garage (lightweight single-binary S3 server, ~35MB RSS)
# and configures ClickHouse to use it as an S3 disk for tiered storage.
# A post-install hook configures the cluster layout, creates the bucket,
# generates a key, and writes credentials to the `garage-backup` secret.
#
# Garage requires its own GK<24-hex> key format, so the key is auto-generated
# by the setup hook. ClickHouse reads it via env vars injected from the secret
# (see podTemplate.extraEnv below). The storage_config.xml uses from_env to
# pick up the credentials at startup.
garage:
  enabled: true
  image:
    repository: dxflrs/garage
    tag: "v2.4.1"
    pullPolicy: IfNotPresent
  bucket: clickhouse        # Bucket for clickhouse-backup (credentials → garage-backup secret)
  dataBucket: data          # Bucket for ClickHouse S3 tiered storage (credentials → garage-data secret)
  storagePolicy: s3_main    # ClickHouse storage policy name to create

  # -- Replication factor (1 = single-node, no redundancy)
  replicationFactor: 1

  # -- RPC secret (64-byte hex). Leave empty to auto-generate and store in a Secret.
  rpcSecret: ""

  # -- Admin API token. Leave empty to auto-generate and store in a Secret.
  adminToken: ""

  # -- Node storage capacity reported to the cluster layout, in KiB.
  # Should match (or be slightly less than) persistence.data.size.
  # 20971520 KiB = 20 GiB
  capacityKiB: "20971520"

  # -- Persistent storage
  persistence:
    meta:
      size: 256Mi
    data:
      size: 20Gi

# Advanced: Pod Template Extra Configuration
podTemplate:
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY are injected automatically by
  # chi.yaml when garage.enabled=true, using the release-scoped secret
  # <fullname>-garage-backup. Add extra env vars here if needed.
  extraEnv: []
  extraVolumeMounts:
    - name: data-volumeclaim-template
      mountPath: /var/lib/clickhouse
  # extraVolumes: []
  sidecars:
    - name: clickhouse-data-checker
      image: busybox:1.35
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - '-c'
        - |
          while true; do
            du -sh /var/lib/clickhouse || true
            sleep 60
          done
      volumeMounts:
        - name: data-volumeclaim-template
          mountPath: /var/lib/clickhouse
          readOnly: true
  # sidecars: []

  # Advanced: Service Template
serviceTemplate:
  type: ClusterIP
  # annotations: {}

# Ingress — expose the ClickHouse HTTP interface (port 8123) via a stable FQDN.
# Requires an ingress controller (e.g. nginx, traefik) in your cluster.
# For native TCP protocol access (port 9000), use serviceTemplate.type: LoadBalancer
# and point your DNS record at the assigned external IP instead.
ingress:
  enabled: false
  className: ""                    # e.g. "nginx", "traefik"
  host: clickhouse.example.com
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
    # - secretName: clickhouse-tls
    #   hosts:
    #     - clickhouse.example.com
