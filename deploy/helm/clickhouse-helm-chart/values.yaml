# Default values for clickhouse-installation.

nameOverride: ''
fullnameOverride: ''

# Cluster Layout
layout:
  shardsCount: 1
  replicasCount: 2

# ClickHouse Image
image:
  repository: clickhouse/clickhouse-server
  tag: '24.8'
  pullPolicy: IfNotPresent

# Storage Configuration
storage:
  data:
    size: 10Gi
    storageClassName: standard # Change to your storage class
    accessModes:
      - ReadWriteOnce
  log:
    enabled: false
    size: 2Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce

# Coordination — required for replication and distributed DDL
# mode: keeper     → deploy a ClickHouseKeeperInstallation (recommended, no external deps)
# mode: zookeeper  → point at an existing external ZooKeeper ensemble
# mode: none       → disable coordination (single-node, no replication)
coordination:
  mode: keeper

  keeper:
    replicasCount: 1  # Use 3 for production HA (must be odd for quorum)
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.1"
      pullPolicy: IfNotPresent
    storage:
      size: 10Gi
      storageClassName: standard
      accessModes:
        - ReadWriteOnce
    resources: {}
      # limits:
      #   cpu: 500m
      #   memory: 512Mi

  zookeeper:
    nodes:
      - host: zookeeper.default.svc.cluster.local
        port: 2181

# ClickHouse Settings (config.xml)
settings:
  compression/case/method: zstd

# ClickHouse Users (users.xml)
adminPassword: '' # Leave empty to generate a random one
users:
  default:
    password: "password"
    networks/ip: "0.0.0.0/0"
  admin:
    profile: default
    networks/ip: 0.0.0.0/0
    access_management: '1'
  dev-user:
    password: adminpassword

# Profiles and Quotas
profiles: {} # default/max_memory_usage: 1000000000

quotas: {}

# Resource Limits/Requests
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Probe Configuration
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 10

# Monitoring
# Enables prometheus monitoring endpoint in ClickHouse
monitoring:
  enabled: false
  # Whether to create a ServiceMonitor for the Prometheus Operator
  serviceMonitor: false
  # Prometheus endpoint configuration
  prometheus:
    enabled: false
    port: 9363

# Custom Configuration Files
files: {}
  # dict1.xml: |
  #   <yandex>
  #       <!-- dictionary config -->
  #   </yandex>

# Tabix UI
# A standalone UI to manage ClickHouse
tabix-ui:
  enabled: true

# Backup — clickhouse-backup sidecar (https://github.com/Altinity/clickhouse-backup)
# Runs as a sidecar alongside ClickHouse, exposes a REST API on port 7171.
# Trigger backups: kubectl exec <pod> -c clickhouse-backup -- clickhouse-backup create-and-upload
backup:
  enabled: false
  image:
    repository: altinity/clickhouse-backup
    tag: "2"
    pullPolicy: IfNotPresent
  s3:
    bucket: ""
    path: "clickhouse/"
    endpoint: ""          # Leave empty for AWS S3. For SeaweedFS: http://<release>-seaweedfs-s3:8333
    region: "us-east-1"
    accessKey: ""
    secretKey: ""
    forcePathStyle: true  # Required for non-AWS S3 (SeaweedFS, MinIO, etc.)
  keepRemote: 7           # Number of remote backups to retain
  resources: {}

# SeaweedFS — optional S3-compatible object store
# When enabled, deploys SeaweedFS and configures ClickHouse to use it as an S3 disk.
seaweedfs:
  enabled: false
  bucket: clickhouse        # Bucket ClickHouse will read/write from
  accessKey: ""             # S3 access key (leave empty for no-auth)
  secretKey: ""             # S3 secret key (leave empty for no-auth)
  storagePolicy: s3_main    # ClickHouse storage policy name to create
  s3:
    enabled: true           # Must be true — enables SeaweedFS S3 gateway

# Advanced: Pod Template Extra Configuration
podTemplate:
  # extraEnv:
  #   - name: SOME_VAR
  #     value: "some_value"
  extraVolumeMounts:
    - name: data-volumeclaim-template
      mountPath: /var/lib/clickhouse
  # extraVolumes: []
  sidecars:
    - name: clickhouse-data-checker
      image: busybox:1.35
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - '-c'
        - |
          while true; do
            du -sh /var/lib/clickhouse || true
            sleep 60
          done
      volumeMounts:
        - name: data-volumeclaim-template
          mountPath: /var/lib/clickhouse
          readOnly: true
  # sidecars: []

  # Advanced: Service Template
serviceTemplate:
  type: ClusterIP
  # annotations: {}