suite: Secrets
templates:
  - secret.yaml
  - backup-secret.yaml

tests:
  - it: renders admin secret
    templates:
      - secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - isNotNull:
          path: data.admin

  - it: admin secret name is derived from release fullname
    templates:
      - secret.yaml
    set:
      fullnameOverride: my-clickhouse
    asserts:
      - equal:
          path: metadata.name
          value: my-clickhouse-admin

  - it: does not render backup secret when backup is disabled
    templates:
      - backup-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders backup secret when backup is enabled
    templates:
      - backup-secret.yaml
    set:
      backup.enabled: true
      backup.s3.accessKey: my-access-key
      backup.s3.secretKey: my-secret-key
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.S3_ACCESS_KEY
          value: my-access-key
      - equal:
          path: stringData.S3_SECRET_KEY
          value: my-secret-key

  - it: backup secret name is derived from release fullname
    templates:
      - backup-secret.yaml
    set:
      backup.enabled: true
      fullnameOverride: my-clickhouse
    asserts:
      - equal:
          path: metadata.name
          value: my-clickhouse-backup

  - it: does not render backup secret when garage is enabled
    templates:
      - backup-secret.yaml
    set:
      backup.enabled: true
      garage.enabled: true
    asserts:
      - hasDocuments:
          count: 0
