{{- if eq .Values.coordination.mode "keeper" }}
apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: {{ include "clickhouse.fullname" . }}-keeper
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  configuration:
    clusters:
      - name: "keeper"
        layout:
          replicasCount: {{ .Values.coordination.keeper.replicasCount }}
    settings:
      listen_host: "0.0.0.0"
      keeper_server/coordination_settings/raft_logs_level: "information"

  defaults:
    templates:
      podTemplate: keeper-pod-template
      dataVolumeClaimTemplate: keeper-data-template

  templates:
    podTemplates:
      - name: keeper-pod-template
        spec:
          {{- if gt (int .Values.coordination.keeper.replicasCount) 1 }}
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: {{ .Release.Name }}
                    topologyKey: kubernetes.io/hostname
          {{- end }}
          containers:
            - name: clickhouse-keeper
              image: {{ printf "%s:%s" .Values.coordination.keeper.image.repository (default .Chart.AppVersion .Values.coordination.keeper.image.tag) }}
              imagePullPolicy: {{ .Values.coordination.keeper.image.pullPolicy }}
              {{- if .Values.coordination.keeper.resources }}
              resources:
                {{- toYaml .Values.coordination.keeper.resources | nindent 16 }}
              {{- end }}
              livenessProbe:
                tcpSocket:
                  port: 2181
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
                successThreshold: 1
              readinessProbe:
                tcpSocket:
                  port: 2181
                initialDelaySeconds: 15
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
                successThreshold: 1
          securityContext:
            fsGroup: 101

    volumeClaimTemplates:
      - name: keeper-data-template
        spec:
          {{- if .Values.coordination.keeper.storage.storageClassName }}
          storageClassName: {{ .Values.coordination.keeper.storage.storageClassName }}
          {{- end }}
          accessModes:
            {{- toYaml .Values.coordination.keeper.storage.accessModes | nindent 12 }}
          resources:
            requests:
              storage: {{ .Values.coordination.keeper.storage.size }}
{{- end }}
