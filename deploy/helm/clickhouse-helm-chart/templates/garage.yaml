{{- if .Values.garage.enabled }}
---
# Garage configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-garage-config
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
data:
  garage.toml: |
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"
    db_engine = "lmdb"

    replication_factor = {{ .Values.garage.replicationFactor | default 1 }}

    rpc_bind_addr = "[::]:3901"
    rpc_secret = "__RPC_SECRET_REPLACE__"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "__ADMIN_TOKEN_REPLACE__"
---
# Garage StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}-garage
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  replicas: 1
  serviceName: {{ include "clickhouse.fullname" . }}-garage-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: garage-init
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sed "s/__RPC_SECRET_REPLACE__/$RPC_SECRET/;s/__ADMIN_TOKEN_REPLACE__/$ADMIN_TOKEN/" /mnt/garage.toml > /mnt/etc/garage.toml
          env:
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse.fullname" . }}-garage-secret
                  key: rpcSecret
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse.fullname" . }}-garage-secret
                  key: adminToken
          volumeMounts:
            - name: config
              mountPath: /mnt/garage.toml
              subPath: garage.toml
            - name: etc
              mountPath: /mnt/etc
      containers:
        - name: garage
          image: "{{ .Values.garage.image.repository }}:{{ .Values.garage.image.tag }}"
          imagePullPolicy: {{ .Values.garage.image.pullPolicy }}
          command: ["/garage", "-c", "/etc/garage.toml", "server"]
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          readinessProbe:
            httpGet:
              path: /health
              port: 3903
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 3903
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: etc
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: meta
              mountPath: /mnt/meta
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "clickhouse.fullname" . }}-garage-config
        - name: etc
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.garage.persistence.meta.size | default "256Mi" }}
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.garage.persistence.data.size | default "20Gi" }}
---
# S3 + Admin service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-garage
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: admin
      port: 3903
      targetPort: 3903
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}-garage-headless
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
{{- end }}
