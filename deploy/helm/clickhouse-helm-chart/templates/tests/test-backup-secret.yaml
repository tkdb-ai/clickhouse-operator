{{- if .Values.backup.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "clickhouse.fullname" . }}-test-backup-secret
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-backup-secret
      image: busybox:1.35
      command:
        - sh
        - -c
        - |
          set -e
          FAIL=0

          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "FAIL: S3_ACCESS_KEY is empty"
            FAIL=1
          else
            echo "PASS: S3_ACCESS_KEY is set"
          fi

          if [ -z "$S3_SECRET_KEY" ]; then
            echo "FAIL: S3_SECRET_KEY is empty"
            FAIL=1
          else
            echo "PASS: S3_SECRET_KEY is set"
          fi

          exit $FAIL
      envFrom:
        - secretRef:
            name: {{ include "clickhouse.fullname" . }}-backup
{{- end }}
