apiVersion: v1
kind: Pod
metadata:
  name: {{ include "clickhouse.fullname" . }}-test-admin-secret
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-admin-secret
      image: busybox:1.35
      command:
        - sh
        - -c
        - |
          set -e
          SECRET_VALUE=$(cat /secrets/admin)
          if [ -z "$SECRET_VALUE" ]; then
            echo "FAIL: admin password is empty"
            exit 1
          fi
          echo "PASS: admin secret exists and is non-empty (length: ${#SECRET_VALUE})"
      volumeMounts:
        - name: admin-secret
          mountPath: /secrets
          readOnly: true
  volumes:
    - name: admin-secret
      secret:
        secretName: {{ include "clickhouse.fullname" . }}-admin
