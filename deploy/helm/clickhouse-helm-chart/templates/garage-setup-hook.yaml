{{- if .Values.garage.enabled }}
{{- $fullname := include "clickhouse.fullname" . }}
{{- $namespace := .Release.Namespace }}
---
# These are regular chart resources (not hooks) so they persist across hook runs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-garage-setup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-garage-setup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-setup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-garage-setup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-garage-setup
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-garage-setup
    namespace: {{ $namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-garage-setup
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: {{ $fullname }}-garage-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine/k8s:1.30.0
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              NS="{{ $namespace }}"
              POD="{{ $fullname }}-garage-0"
              CAPACITY="{{ .Values.garage.capacityKiB | default 20971520 | int }}"

              provision_bucket() {
                local BUCKET="$1" KEY_NAME="$2" SECRET_NAME="$3"

                if kubectl get secret "${SECRET_NAME}" -n "${NS}" > /dev/null 2>&1; then
                  echo "Secret ${SECRET_NAME} already exists — skipping ${BUCKET}."
                  return 0
                fi

                echo "Creating bucket ${BUCKET}..."
                kubectl exec -n "${NS}" "${POD}" -- /garage bucket create "${BUCKET}" 2>&1 || true

                echo "Creating access key ${KEY_NAME}..."
                kubectl exec -n "${NS}" "${POD}" -- /garage key create "${KEY_NAME}" 2>&1 || true
                KEY_INFO=$(kubectl exec -n "${NS}" "${POD}" -- /garage key info "${KEY_NAME}" --show-secret 2>&1)
                ACCESS_KEY_ID=$(echo "${KEY_INFO}" | grep "^Key ID:" | sed 's/Key ID:  *//')
                SECRET_KEY=$(echo "${KEY_INFO}" | grep "^Secret key:" | sed 's/Secret key:  *//')

                echo "Granting permissions..."
                kubectl exec -n "${NS}" "${POD}" -- /garage bucket allow "${BUCKET}" --key "${KEY_NAME}" --read --write

                echo "Storing credentials in secret ${SECRET_NAME}..."
                kubectl create secret generic "${SECRET_NAME}" \
                  -n "${NS}" \
                  --from-literal=access-key-id="${ACCESS_KEY_ID}" \
                  --from-literal=secret-access-key="${SECRET_KEY}"

                echo "Done: bucket=${BUCKET} key=${ACCESS_KEY_ID} secret=${SECRET_NAME}"
              }

              echo "=== Garage Setup ==="

              echo "Waiting for Garage..."
              until kubectl exec -n "${NS}" "${POD}" -- /garage status > /dev/null 2>&1; do
                echo "Not ready, retrying in 3s..."
                sleep 3
              done
              echo "Garage is ready."

              # Parse node ID from status output (first hex field on a data line)
              NODE_ID=$(kubectl exec -n "${NS}" "${POD}" -- /garage status 2>&1 | awk '/^[0-9a-f]/{print $1; exit}')
              echo "Node ID: ${NODE_ID}"

              # Assign layout (idempotent — assign always succeeds even if already assigned)
              kubectl exec -n "${NS}" "${POD}" -- /garage layout assign -z dc1 -c "${CAPACITY}" "${NODE_ID}" 2>&1 || true

              # Apply only if staged changes exist
              APPLY_VERSION=$(kubectl exec -n "${NS}" "${POD}" -- /garage layout show 2>&1 \
                | grep "garage layout apply" | awk '{print $NF}' | tr -d '\r')
              if [ -n "${APPLY_VERSION}" ]; then
                echo "Applying layout version ${APPLY_VERSION}..."
                kubectl exec -n "${NS}" "${POD}" -- /garage layout apply --version "${APPLY_VERSION}"
              else
                echo "Layout already applied, skipping."
              fi

              provision_bucket "{{ .Values.garage.bucket }}"     "{{ .Values.garage.bucket }}-access"     "{{ $fullname }}-garage-backup"
              provision_bucket "{{ .Values.garage.dataBucket }}" "{{ .Values.garage.dataBucket }}-access" "{{ $fullname }}-garage-data"

              echo "=== Garage setup complete ==="
              echo "S3 endpoint : {{ .Release.Name }}-garage:3900"
              echo "Buckets     : {{ .Values.garage.bucket }}, {{ .Values.garage.dataBucket }}"
{{- end }}
