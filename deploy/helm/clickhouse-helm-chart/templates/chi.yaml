{{- $podTemplate := default (dict) .Values.podTemplate -}}
apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volumeclaim-template
      {{- if .Values.storage.log.enabled }}
      logVolumeClaimTemplate: log-volumeclaim-template
      {{- end }}
      podTemplate: main-pod-template
      {{- if .Values.serviceTemplate }}
      serviceTemplate: main-service-template
      {{- end }}

  configuration:
    {{- if eq .Values.coordination.mode "keeper" }}
    zookeeper:
      keeper:
        name: {{ include "clickhouse.fullname" . }}-keeper
    {{- else if eq .Values.coordination.mode "zookeeper" }}
    zookeeper:
      nodes:
        {{- toYaml .Values.coordination.zookeeper.nodes | nindent 8 }}
    {{- end }}
    
    users:
      {{- range $user, $config := .Values.users }}
      {{- if and (eq $user "admin") (not $config.k8s_secret_password) (not $config.password) }}
      {{ $user }}/k8s_secret_password: {{ printf "%s-admin/admin" (include "clickhouse.fullname" $) | quote }}
      {{- end }}
      {{- range $key, $val := $config }}
      {{- if kindIs "map" $val }}
      {{- range $k2, $v2 := $val }}
      {{ $user }}/{{ $key }}/{{ $k2 }}: {{ $v2 | quote }}
      {{- end }}
      {{- else }}
      {{ $user }}/{{ $key }}: {{ $val | quote }}
      {{- end }}
      {{- end }}
      {{- end }}

    profiles:
      {{- toYaml .Values.profiles | nindent 6 }}

    quotas:
      {{- toYaml .Values.quotas | nindent 6 }}

    settings:
      {{- toYaml .Values.settings | nindent 6 }}

    files:
      {{- if .Values.files }}
      {{- toYaml .Values.files | nindent 6 }}
      {{- end }}
      {{- if .Values.seaweedfs.enabled }}
      storage_config.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <s3_disk>
                <type>s3</type>
                <endpoint>http://{{ .Release.Name }}-seaweedfs-s3:8333/{{ .Values.seaweedfs.bucket }}/</endpoint>
                <access_key_id>{{ .Values.seaweedfs.accessKey }}</access_key_id>
                <secret_access_key>{{ .Values.seaweedfs.secretKey }}</secret_access_key>
              </s3_disk>
            </disks>
            <policies>
              <{{ .Values.seaweedfs.storagePolicy }}>
                <volumes>
                  <main>
                    <disk>s3_disk</disk>
                  </main>
                </volumes>
              </{{ .Values.seaweedfs.storagePolicy }}>
            </policies>
          </storage_configuration>
        </clickhouse>
      {{- else if not .Values.files }}
      {}
      {{- end }}

    clusters:
      - name: "main"
        layout:
          shardsCount: {{ .Values.layout.shardsCount }}
          replicasCount: {{ .Values.layout.replicasCount }}

  {{- if and .Values.monitoring .Values.monitoring.enabled }}
  # Enables prometheus monitoring endpoint
  monitoring:
    prometheus:
      enabled: {{ default true .Values.monitoring.prometheus.enabled }}
      {{- if .Values.monitoring.serviceMonitor }}
      serviceMonitor: true
      {{- end }}
      port: {{ default 9363 .Values.monitoring.prometheus.port }}
  {{- end }}

  templates:
    podTemplates:
      - name: main-pod-template
        spec:
          containers:
            - name: clickhouse
              image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- if .Values.resources }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- end }}
              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 60 }}
                periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
                timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 10 }}
                periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
                timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
              {{- if or $podTemplate.extraEnv $podTemplate.extraVolumeMounts }}
              {{- if $podTemplate.extraEnv }}
              env:
                {{- toYaml $podTemplate.extraEnv | nindent 16 }}
              {{- end }}
              {{- if $podTemplate.extraVolumeMounts }}
              volumeMounts:
                {{- toYaml $podTemplate.extraVolumeMounts | nindent 16 }}
              {{- end }}
              {{- end }}
          {{- if $podTemplate.sidecars }}
          {{- toYaml $podTemplate.sidecars | nindent 12 }}
          {{- end }}
          {{- if .Values.backup.enabled }}
            - name: clickhouse-backup
              image: {{ printf "%s:%s" .Values.backup.image.repository .Values.backup.image.tag }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              command: ["bash", "-xc", "/bin/clickhouse-backup server"]
              ports:
                - name: backup-rest
                  containerPort: 7171
              env:
                - name: API_LISTEN
                  value: "0.0.0.0:7171"
                - name: API_ENABLE_METRICS
                  value: "true"
                - name: API_CREATE_INTEGRATION_TABLES
                  value: "true"
                - name: REMOTE_STORAGE
                  value: "s3"
                - name: BACKUPS_TO_KEEP_REMOTE
                  value: {{ .Values.backup.keepRemote | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3.bucket | quote }}
                - name: S3_PATH
                  value: {{ .Values.backup.s3.path | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.s3.endpoint | quote }}
                - name: S3_REGION
                  value: {{ .Values.backup.s3.region | quote }}
                - name: S3_FORCE_PATH_STYLE
                  value: {{ .Values.backup.s3.forcePathStyle | quote }}
                - name: CLICKHOUSE_USERNAME
                  value: "admin"
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clickhouse.fullname" . }}-admin
                      key: admin
              envFrom:
                - secretRef:
                    name: {{ include "clickhouse.fullname" . }}-backup
              {{- if .Values.backup.resources }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: data-volumeclaim-template
                  mountPath: /var/lib/clickhouse
          {{- end }}
          {{- if $podTemplate.extraVolumes }}
          volumes:
            {{- toYaml $podTemplate.extraVolumes | nindent 12 }}
          {{- end }}

    volumeClaimTemplates:
      - name: data-volumeclaim-template
        spec:
          {{- if .Values.storage.data.storageClassName }}
          storageClassName: {{ .Values.storage.data.storageClassName }}
          {{- end }}
          accessModes:
            {{- toYaml .Values.storage.data.accessModes | nindent 12 }}
          resources:
            requests:
              storage: {{ .Values.storage.data.size }}
      {{- if .Values.storage.log.enabled }}
      - name: log-volumeclaim-template
        spec:
          {{- if .Values.storage.log.storageClassName }}
          storageClassName: {{ .Values.storage.log.storageClassName }}
          {{- end }}
          accessModes:
            {{- toYaml .Values.storage.log.accessModes | nindent 12 }}
          resources:
            requests:
              storage: {{ .Values.storage.log.size }}
      {{- end }}

    {{- if .Values.serviceTemplate }}
    serviceTemplates:
      - name: main-service-template
        spec:
          {{- toYaml .Values.serviceTemplate | nindent 10 }}
    {{- end }}
