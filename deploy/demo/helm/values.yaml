# Demo values for deploy/helm/clickhouse-helm-chart. Only what differs from the
# chart defaults is listed; see SETUP.md for the why behind each choice.
#
#   helm upgrade --install demo ../helm/clickhouse-helm-chart -n ch-demo -f helm/values.yaml
#
# CHI "demo", CHK "demo-keeper", client Service "clickhouse-demo", cluster "main".
fullnameOverride: demo

operator:
  enabled: false         # installed separately, watching ch-demo (see SETUP.md)

# --- Knobs the demo steps change ----------------------------------------------
image:
  tag: "24.8"            # rolling-upgrade step goes to 25.3

layout:
  shardsCount: 2         # scale step
  replicasCount: 2       # scale step
  antiAffinityScope: Shard   # default scope leaves one of 4 pods Pending on 3 nodes

# Flat "<profile>/<setting>" keys. Quote big numbers (Helm renders 1e+09).
profiles:
  default/max_threads: "4"
  default/max_memory_usage: "1000000000"   # live-config step changes this

# --- Static setup --------------------------------------------------------------
clusterSecret:
  enabled: true

# Users render as "<user>/<key>: <value>"; values must be scalars.
users:
  default:               # local to each pod, used by ch_pod in the scripts
    password: ""
    networks/ip: "127.0.0.1/32"
  demo:                  # password "demo"
    password_sha256_hex: 2a97516c354b68848cdbd8f54a226a0a55b21ed138e207ad6c5cbb9c00aa5aea
    networks/ip: "0.0.0.0/0"
    profile: default
    access_management: "1"
  dev-user: null         # drop the chart's plaintext-password user

settings:
  logger/level: information

storage:
  data:
    size: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

coordination:
  keeper:
    replicasCount: 3     # odd, never changed after install
    image:
      tag: "24.8"
    storage:
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# --- Chart add-ons that are on by default but would break or slow the demo ----
namedCollections: null   # null, not {} (Helm merges {}); default needs a db.user_labels table
podTemplate:
  sidecars: []           # default cron-sidecar image isn't pullable on minikube
  extraVolumeMounts: []  # the operator mounts the data PVC itself
garage:
  enabled: true          # in-cluster S3 server that receives the backups
backup:
  enabled: true          # clickhouse-backup sidecar per pod plus a daily CronJob
ch-ui:
  enabled: false
